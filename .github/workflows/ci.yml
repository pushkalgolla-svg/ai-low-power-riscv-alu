name: RTL Verification & Low-Power PPA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verilog-ci:
    name: Icarus Verilog Simulation & Synthesis CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System EDA Tools (Icarus Verilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          mkdir -p reports

      - name: Install Pinned EDA & Offline Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify 8-Bit ALU (Icarus Verilog)
        run: |
          echo "=== Compiling & Running 8-bit ALU Testbench ==="
          iverilog -g2005-sv -o reports/alu_sim.vvp src/alu_baseline.v src/alu_optimized.v tb/alu_tb.v
          vvp reports/alu_sim.vvp

      - name: Verify 32-Bit RISC-V (RV32I) ALU (Icarus Verilog)
        run: |
          echo "=== Compiling & Running 32-bit RISC-V ALU Testbench ==="
          iverilog -g2005-sv -DDUMP_VCD -o reports/riscv_sim.vvp src/riscv_alu_baseline.v src/riscv_alu_optimized.v tb/riscv_alu_tb.v
          vvp reports/riscv_sim.vvp

      - name: Run 8-Bit Pipeline Orchestrator (Offline Mode)
        run: |
          echo "=== Executing scripts/optimize.py ==="
          python scripts/optimize.py

      - name: Run 32-Bit RISC-V Pipeline Orchestrator (Offline Mode)
        run: |
          echo "=== Executing scripts/optimize_riscv.py ==="
          python scripts/optimize_riscv.py

      - name: Verify Generated Reports & Non-Zero Synthesis Statistics
        run: |
          echo "=== Verifying Artifact Generation & Valid Non-Zero Statistics ==="
          test -f reports/comparison_report.txt
          test -f reports/riscv_ppa_report.txt
          test -f reports/riscv_activity.vcd
          python -c "
          import sys
          reports = ['reports/comparison_report.txt', 'reports/riscv_ppa_report.txt']
          for r in reports:
              with open(r, 'r', encoding='utf-8') as f:
                  content = f.read()
              lines = content.splitlines()
              found_cells = False
              found_wires = False
              base_cells = 0
              opt_cells = 0
              base_wires = 0
              opt_wires = 0
              for line in lines:
                  if 'Total Synthesized Netlist Cells' in line:
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 3:
                          base_cells = int(parts[1])
                          opt_cells = int(parts[2])
                          assert base_cells > 0, f'Zero baseline cells in {r}'
                          assert opt_cells > 0, f'Zero opt cells in {r}'
                          found_cells = True
                  if 'Netlist Interconnect Wires' in line:
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 3:
                          base_wires = int(parts[1])
                          opt_wires = int(parts[2])
                          assert base_wires > 0, f'Zero baseline wires in {r}'
                          assert opt_wires > 0, f'Zero opt wires in {r}'
                          found_wires = True
              if not found_cells or not found_wires:
                  print(f'[FATAL] Failed to find valid non-zero statistics in {r} (cells={found_cells}, wires={found_wires})')
                  sys.exit(1)
              if 'comparison_report.txt' in r:
                  assert (base_cells, opt_cells) == (231, 224), f'Unexpected 8-bit cells in {r}: {(base_cells, opt_cells)}'
                  assert (base_wires, opt_wires) == (145, 117), f'Unexpected 8-bit wires in {r}: {(base_wires, opt_wires)}'
                  print(f'Verified 8-bit ALU counts: {base_cells}/{opt_cells} cells, {base_wires}/{opt_wires} wires')
              elif 'riscv_ppa_report.txt' in r:
                  assert (base_cells, opt_cells) == (1485, 1499), f'Unexpected 32-bit cells in {r}: {(base_cells, opt_cells)}'
                  assert (base_wires, opt_wires) == (602, 491), f'Unexpected 32-bit wires in {r}: {(base_wires, opt_wires)}'
                  print(f'Verified 32-bit RV32I ALU counts: {base_cells}/{opt_cells} cells, {base_wires}/{opt_wires} wires')
          print('Report integrity verified: Non-zero synthesis cells and wires confirmed across all reports!')
          "
